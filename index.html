<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you be my Valentine?</title>

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css" />

    <style>
      :root {
        --bg1: #ffd6e7;
        --bg2: #ffeef6;
        --card: #ffffffcc;
        --yes: #ff3b7a;
        --yesHover: #ff1f68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1));
        font-family: system-ui, sans-serif;
        overflow: hidden;
        padding: 16px;
      }

      /* FULL-SCREEN CONFETTI CANVAS */
      #confettiCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
      }

      .art {
        width: min(260px, 80vw);
        margin: 0 auto 10px;
        display: block;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.12));
      }

      h1 {
        font-size: clamp(26px, 4vw, 44px);
        margin: 12px 0 18px;
      }

      .button-zone {
        position: relative;
        width: min(520px, 92%);
        height: 150px;
        margin: 0 auto;
        touch-action: none;
      }

      button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 800;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
      }

      #yesBtn {
        left: 18%;
        background: var(--yes);
        color: #fff;
      }
      #yesBtn:hover {
        background: var(--yesHover);
      }

      #noBtn {
        left: 62%;
        background: #e5e7eb;
        color: #111827;
      }

      .hint {
        margin-top: 10px;
        font-size: 13px;
        opacity: 0.7;
      }

      .result {
        display: none;
        margin-top: 18px;
        animation: pop 0.35s ease;
      }

      .deny {
        display: none;
        margin-top: 18px;
        animation: pop 0.35s ease;
      }

      .result h2 {
        font-size: clamp(30px, 4.5vw, 46px);
        margin: 10px 0;
      }

      .fireworks {
        width: min(380px, 90vw);
        margin: 0 auto;
        display: block;
      }

      @keyframes pop {
        from {
          transform: scale(0.96);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="confettiCanvas"></canvas>

    <main class="card">
      <!-- ANIMAL WITH HEART -->
      <div class="heart-container">
        <svg viewBox="0 0 100 100" width="100" height="100">
          <path
            class="heart"
            d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4s24.7-9.5 34.2 0L50 20.5l-0.9 0.9c9.5-9.5 24.7-9.5 34.2 0s9.5 24.7 0 34.2L50 88.9z"
          />
          <path
            class="broken-heart"
            d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4s24.7-9.5 34.2 0L50 20.5l-0.9 0.9c9.5-9.5 24.7-9.5 34.2 0s9.5 24.7 0 34.2L50 88.9z"
          />
          <circle class="sparkle" cx="25" cy="25" r="2" />
          <circle class="sparkle" cx="75" cy="25" r="2" />
          <circle class="sparkle" cx="50" cy="15" r="2" />
        </svg>
      </div>

      <h1>Sara, will you be my valentine?</h1>

      <section class="button-zone" id="zone">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </section>

      <!-- HINT -->
      <div class="hint" id="hint">“No” seems a bit shy 😈</div>

      <section class="result" id="result">
        <h2>YAY! 🎉</h2>
        <img
          class="fireworks"
          src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
          alt="Fireworks"
        />
      </section>
      <section class="deny" id="deny">
        <h2>Oh No you've made it to dingle! 🎉</h2>
        <img
          class="fireworks"
          src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
          alt="Fireworks"
        />
      </section>
    </main>

    <script>
      const zone = document.getElementById("zone");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const result = document.getElementById("result");
      const deny = document.getElementById("deny");
      const hint = document.getElementById("hint");

      /* ---------- CONFETTI ---------- */
      const confettiCanvas = document.getElementById("confettiCanvas");

      function resizeConfettiCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        confettiCanvas.width = Math.floor(window.innerWidth * dpr);
        confettiCanvas.height = Math.floor(window.innerHeight * dpr);
        confettiCanvas.style.width = "100vw";
        confettiCanvas.style.height = "100vh";
      }

      resizeConfettiCanvas();
      window.addEventListener("resize", resizeConfettiCanvas);
      window.addEventListener("orientationchange", () =>
        setTimeout(resizeConfettiCanvas, 150),
      );

      const confettiInstance = confetti.create(confettiCanvas, {
        resize: false,
        useWorker: true,
      });

      function fullScreenConfetti() {
        const end = Date.now() + 1600;

        (function frame() {
          confettiInstance({
            particleCount: 12,
            spread: 90,
            startVelocity: 45,
            ticks: 180,
            origin: { x: Math.random(), y: Math.random() * 0.3 },
          });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();

        setTimeout(() => {
          confettiInstance({
            particleCount: 300,
            spread: 140,
            startVelocity: 60,
            ticks: 220,
            origin: { x: 0.5, y: 0.55 },
          });
        }, 300);
      }

      /* ---------- YES BUTTON GROWS ---------- */
      let yesScale = 1;
      function growYes() {
        yesScale = Math.min(2.2, yesScale + 0.03);
        yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
      }

      /* ---------- NO BUTTON RUNS AWAY ---------- */
      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function moveNo(px, py) {
        const z = zone.getBoundingClientRect();
        const b = noBtn.getBoundingClientRect();

        let dx = b.left + b.width / 2 - px;
        let dy = b.top + b.height / 2 - py;
        let mag = Math.hypot(dx, dy) || 1;
        dx /= mag;
        dy /= mag;

        let newLeft = b.left - z.left + dx * 150;
        let newTop = b.top - z.top + dy * 150;

        newLeft = clamp(newLeft, 0, z.width - b.width);
        newTop = clamp(newTop, 0, z.height - b.height);

        noBtn.style.left = newLeft + "px";
        noBtn.style.top = newTop + "px";
        noBtn.style.transform = "none";

        growYes();
      }

      zone.addEventListener("pointermove", (e) => {
        const b = noBtn.getBoundingClientRect();
        const d = Math.hypot(
          b.left + b.width / 2 - e.clientX,
          b.top + b.height / 2 - e.clientY,
        );
        if (d < 140) moveNo(e.clientX, e.clientY);
      });

      noBtn.addEventListener("click", () => {
        zone.style.display = "none";
        hint.style.display = "none"; // HIDE THE HINT
        deny.style.display = "block";

        
      });

      /* ---------- YES CLICK ---------- */
      yesBtn.addEventListener("click", () => {
        zone.style.display = "none";
        hint.style.display = "none"; // HIDE THE HINT
        result.style.display = "block";
        resizeConfettiCanvas();
        fullScreenConfetti();
      });

      
    </script>
  </body>
</html>
